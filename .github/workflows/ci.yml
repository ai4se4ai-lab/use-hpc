name: Website and release automation CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Validate built pages and download links
        run: node website/scripts/check-build.mjs
